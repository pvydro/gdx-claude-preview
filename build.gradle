apply plugin: 'java-library'
apply plugin: 'maven-publish'

group = 'com.github.pvydro'
version = '1.1.0'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {
    compileOnly "com.badlogicgames.gdx:gdx:1.12.0"
    compileOnly "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:4.11.0"
    testImplementation "com.badlogicgames.gdx:gdx:1.12.0"
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.github.pvydro'
            artifactId = 'gdx-claude-preview'
        }
    }
}
